<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c3cfe2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGradient)"/>

  <!-- Pattern -->
  <g opacity="0.3">
    <path d="M0,100 Q150,50 300,100 T600,100 T900,100 T1200,100" stroke="#ccd6e0" fill="none" stroke-width="2"/>
    <path d="M0,200 Q150,150 300,200 T600,200 T900,200 T1200,200" stroke="#ccd6e0" fill="none" stroke-width="2"/>
    <path d="M0,300 Q150,250 300,300 T600,300 T900,300 T1200,300" stroke="#ccd6e0" fill="none" stroke-width="2"/>
    <path d="M0,400 Q150,350 300,400 T600,400 T900,400 T1200,400" stroke="#ccd6e0" fill="none" stroke-width="2"/>
    <path d="M0,500 Q150,450 300,500 T600,500 T900,500 T1200,500" stroke="#ccd6e0" fill="none" stroke-width="2"/>
  </g>

  <!-- Center clock -->
  <g transform="translate(600, 300)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="180" fill="#4a5568" stroke="#ffffff" stroke-width="8"/>
    <!-- Hour marks -->
    <g fill="#ffffff">
      <rect x="-4" y="-160" width="8" height="20" rx="2"/>
      <rect x="-4" y="140" width="8" height="20" rx="2"/>
      <rect x="-160" y="-4" width="20" height="8" rx="2"/>
      <rect x="140" y="-4" width="20" height="8" rx="2"/>
    </g>
    <!-- Hour hand (11 o'clock) -->
    <rect x="-8" y="-80" width="16" height="90" rx="8" fill="#ffffff" transform="rotate(330)"/>
    <!-- Minute hand -->
    <rect x="-6" y="-120" width="12" height="130" rx="6" fill="#ffffff" transform="rotate(0)"/>
    <!-- Second hand -->
    <rect x="-2" y="-150" width="4" height="160" rx="2" fill="#dc2626"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Blog text -->
  <text x="600" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#4a5568" text-anchor="middle" opacity="0.8">
    bingxueyizu's blog
  </text>
</svg>
